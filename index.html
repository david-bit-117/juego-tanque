<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚗 TANQUE EN EL LABERINTO 🏍️</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { 
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
            padding: 10px;
        }
        h1 { 
            margin-bottom: 8px; 
            font-size: 1.8rem; 
            text-shadow: 0 0 15px #ffd700;
            color: #ffd700;
        }
        .info { 
            margin: 8px; 
            display: flex; 
            gap: 25px; 
            font-size: 18px;
            font-weight: bold;
        }
        canvas { 
            border: 4px solid #ffd700; 
            background: #0f0f23;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            max-width: 100%;
            max-height: 75vh;
        }
        .controles {
            margin-top: 10px;
            font-size: 13px;
            text-align: center;
            opacity: 0.9;
            line-height: 1.5;
        }
        .botones-movil {
            display: none;
            margin-top: 15px;
            grid-template-columns: repeat(3, 75px);
            grid-template-rows: repeat(3, 75px);
            gap: 8px;
        }
        .btn {
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 26px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .btn:active { 
            background: linear-gradient(145deg, #ffaa00, #ff8800);
            transform: scale(0.95);
        }
        .vacio { background: transparent; box-shadow: none; }

        @media (max-width: 768px) {
            .botones-movil { display: grid; }
        }
    </style>
</head>
<body>

    <h1>🚗 TANQUE EN EL LABERINTO 🏍️</h1>
    <div class="info">
        <span>🏆 Nivel: <span id="nivel">1</span></span>
        <span>❤️ Vidas: <span id="vidas">3</span></span>
        <span>👾 Enemigos: <span id="enemigos">0</span></span>
    </div>
    <canvas id="canvas" width="640" height="480"></canvas>
    
    <div class="controles">
        💻 Teclado: Flechas para moverse | ESPACIO para disparar<br>
        📱 Móvil: Botones en pantalla + botón central para disparar<br>
        🔊 ¡Activa el sonido! 🔊
    </div>

    <div class="botones-movil">
        <button class="btn vacio"></button>
        <button class="btn" id="btnArriba">⬆️</button>
        <button class="btn vacio"></button>

        <button class="btn" id="btnIzquierda">⬅️</button>
        <button class="btn" id="btnDisparar">💥</button>
        <button class="btn" id="btnDerecha">➡️</button>

        <button class="btn vacio"></button>
        <button class="btn" id="btnAbajo">⬇️</button>
        <button class="btn vacio"></button>
    </div>

<script>
// === SISTEMA DE SONIDOS ===
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function iniciarAudio() {
    if(!audioCtx) audioCtx = new AudioContext();
}

// Función para generar sonidos con código
function reproducirSonido(tipo) {
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const ahora = audioCtx.currentTime;

    switch(tipo) {
        case 'disparo':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, ahora);
            osc.frequency.exponentialRampToValueAtTime(80, ahora + 0.1);
            gain.gain.setValueAtTime(0.25, ahora);
            gain.gain.exponentialRampToValueAtTime(0.001, ahora + 0.1);
            osc.start(ahora);
            osc.stop(ahora + 0.1);
            break;

        case 'explosion':
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(180, ahora);
            osc.frequency.exponentialRampToValueAtTime(40, ahora + 0.35);
            gain.gain.setValueAtTime(0.45, ahora);
            gain.gain.exponentialRampToValueAtTime(0.001, ahora + 0.35);
            osc.start(ahora);
            osc.stop(ahora + 0.35);
            break;

        case 'destruirBloque':
            osc.type = 'square';
            osc.frequency.setValueAtTime(320, ahora);
            osc.frequency.exponentialRampToValueAtTime(120, ahora + 0.12);
            gain.gain.setValueAtTime(0.18, ahora);
            gain.gain.exponentialRampToValueAtTime(0.001, ahora + 0.12);
            osc.start(ahora);
            osc.stop(ahora + 0.12);
            break;

        case 'nivelSuperado':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, ahora);
            osc.frequency.setValueAtTime(554, ahora + 0.12);
            osc.frequency.setValueAtTime(659, ahora + 0.24);
            osc.frequency.setValueAtTime(880, ahora + 0.36);
            gain.gain.setValueAtTime(0.22, ahora);
            gain.gain.exponentialRampToValueAtTime(0.001, ahora + 0.5);
            osc.start(ahora);
            osc.stop(ahora + 0.5);
            break;

        case 'perderVida':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, ahora);
            osc.frequency.exponentialRampToValueAtTime(55, ahora + 0.5);
            gain.gain.setValueAtTime(0.35, ahora);
            gain.gain.exponentialRampToValueAtTime(0.001, ahora + 0.5);
            osc.start(ahora);
            osc.stop(ahora + 0.5);
            break;

        case 'derrotarEnemigo':
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, ahora);
            osc.frequency.exponentialRampToValueAtTime(600, ahora + 0.08);
            osc.frequency.exponentialRampToValueAtTime(100, ahora + 0.15);
            gain.gain.setValueAtTime(0.25, ahora);
            gain.gain.exponentialRampToValueAtTime(0.001, ahora + 0.15);
            osc.start(ahora);
            osc.stop(ahora + 0.15);
            break;
    }
}

// === CONFIGURACIÓN DEL JUEGO ===
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const TAM_CASILLA = 32;
const ANCHO = canvas.width / TAM_CASILLA;
const ALTO = canvas.height / TAM_CASILLA;

// Variables del juego
let nivel = 1;
let vidas = 3;
let mapa = [];
let jugador = {};
let enemigos = [];
let balas = [];
let explosiones = [];
let bloquesDestruibles = [];
let ENEMIGOS_MAX = 3;
let VELOCIDAD_ENEMIGOS = 700;
let JUGADOR_MUERTO = false;

// Tipos de casillas
const VACIO = 0;
const PARED = 1;
const BLOQUE = 2;

// Colores mejorados
const COLOR_PARED = '#2c3e50';
const COLOR_PARED_BORDE = '#1a252f';
const COLOR_BLOQUE = '#8b4513';
const COLOR_BLOQUE_BORDE = '#5c2e0a';
const COLOR_SUELO = '#0f0f23';

// === GENERAR MAPA (estilo Bomberman) ===
function generarMapa() {
    mapa = [];
    bloquesDestruibles = [];

    // Poner paredes en bordes
    for(let y=0; y<ALTO; y++) {
        mapa[y] = [];
        for(let x=0; x<ANCHO; x++) {
            if(x === 0 || y === 0 || x === ANCHO-1 || y === ALTO-1) {
                mapa[y][x] = PARED;
            } else {
                mapa[y][x] = VACIO;
            }
        }
    }

    // Poner paredes fijas indestructibles alternadas
    for(let y=2; y<ALTO-1; y+=2) {
        for(let x=2; x<ANCHO-1; x+=2) {
            mapa[y][x] = PARED;
        }
    }

    // Poner bloques destruibles (más en niveles altos)
    let probabilidad = 0.3 + (nivel * 0.05);
    for(let y=1; y<ALTO-1; y++) {
        for(let x=1; x<ANCHO-1; x++) {
            if(mapa[y][x] === VACIO && !(x<=2 && y<=2)) {
                if(Math.random() < probabilidad) {
                    mapa[y][x] = BLOQUE;
                    bloquesDestruibles.push({x, y});
                }
            }
        }
    }
}

// === INICIALIZAR JUGADOR Y ENEMIGOS ===
function reiniciarNivel() {
    generarMapa();
    balas = [];
    explosiones = [];
    JUGADOR_MUERTO = false;
    
    jugador = {
        x: 1.5, y: 1.5,
        dirX: 1, dirY: 0,
        ultimoDisparo: 0,
        angulo: 0
    };

    enemigos = [];
    ENEMIGOS_MAX = 2 + nivel;
    VELOCIDAD_ENEMIGOS = Math.max(350, 850 - nivel * 120);

    for(let i=0; i<ENEMIGOS_MAX; i++) {
        let ex, ey;
        do {
            ex = Math.floor(Math.random() * (ANCHO - 5)) + 3;
            ey = Math.floor(Math.random() * (ALTO - 5)) + 3;
        } while(mapa[ey][ex] !== VACIO || (ex<=3 && ey<=3));

        const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
        const [dx, dy] = dirs[Math.floor(Math.random() * 4)];

        enemigos.push({
            x: ex + 0.5, y: ey + 0.5,
            dx: dx, dy: dy,
            ultimoMov: 0,
            cambiador: 0
        });
    }

    actualizarUI();
}

// === DIBUJAR EL MAPA ===
function dibujarMapa() {
    ctx.fillStyle = COLOR_SUELO;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = 'rgba(50, 70, 90, 0.15)';
    ctx.lineWidth = 1;
    for(let x=0; x<=ANCHO; x++) {
        ctx.beginPath();
        ctx.moveTo(x*TAM_CASILLA, 0);
        ctx.lineTo(x*TAM_CASILLA, canvas.height);
        ctx.stroke();
    }
    for(let y=0; y<=ALTO; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y*TAM_CASILLA);
        ctx.lineTo(canvas.width, y*TAM_CASILLA);
        ctx.stroke();
    }

    for(let y=0; y<ALTO; y++) {
        for(let x=0; x<ANCHO; x++) {
            if(mapa[y][x] === PARED) {
                ctx.fillStyle = COLOR_PARED;
                ctx.fillRect(x*TAM_CASILLA+2, y*TAM_CASILLA+2, TAM_CASILLA-4, TAM_CASILLA-4);
                ctx.strokeStyle = COLOR_PARED_BORDE;
                ctx.lineWidth = 2;
                ctx.strokeRect(x*TAM_CASILLA+2, y*TAM_CASILLA+2, TAM_CASILLA-4, TAM_CASILLA-4);
            } 
            else if(mapa[y][x] === BLOQUE) {
                ctx.fillStyle = COLOR_BLOQUE;
                ctx.fillRect(x*TAM_CASILLA+4, y*TAM_CASILLA+4, TAM_CASILLA-8, TAM_CASILLA-8);
                ctx.strokeStyle = COLOR_BLOQUE_BORDE;
                ctx.lineWidth = 2;
                ctx.strokeRect(x*TAM_CASILLA+4, y*TAM_CASILLA+4, TAM_CASILLA-8, TAM_CASILLA-8);
                ctx.beginPath();
                ctx.moveTo(x*TAM_CASILLA+8, y*TAM_CASILLA+8);
                ctx.lineTo(x*TAM_CASILLA+TAM_CASILLA-8, y*TAM_CASILLA+TAM_CASILLA-8);
                ctx.strokeStyle = COLOR_BLOQUE_BORDE;
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }
    }
}

// === DIBUJAR CARRO DEL JUGADOR ===
function dibujarCarro() {
    const cx = jugador.x * TAM_CASILLA;
    const cy = jugador.y * TAM_CASILLA;
    const tam = TAM_CASILLA * 0.75;

    let angulo = 0;
    if(jugador.dirX === 1) angulo = 0;
    else if(jugador.dirY === 1) angulo = Math.PI/2;
    else if(jugador.dirX === -1) angulo = Math.PI;
    else if(jugador.dirY === -1) angulo = -Math.PI/2;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angulo);

    ctx.fillStyle = '#3498db';
    ctx.beginPath();
    ctx.roundRect(-tam/2, -tam/3, tam, tam*0.66, 6);
    ctx.fill();
    ctx.strokeStyle = '#2980b9';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#1a252f';
    ctx.fillRect(-tam/2 - 3, -tam/3 - 3, 6, 8);
    ctx.fillRect(-tam/2 - 3, tam/3 - 5, 6, 8);
    ctx.fillRect(tam/2 - 3, -tam/3 - 3, 6, 8);
    ctx.fillRect(tam/2 - 3, tam/3 - 5, 6, 8);

    ctx.fillStyle = '#ffd700';
    ctx.fillRect(tam/4 - 2, -4, tam/2 + 4, 8);
    ctx.fillStyle = '#ff8800';
    ctx.beginPath();
    ctx.moveTo(tam/2 + 2, -5);
    ctx.lineTo(tam/2 + 10, 0);
    ctx.lineTo(tam/2 + 2, 5);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

// === DIBUJAR MOTO ENEMIGA ===
function dibujarMoto(enemigo) {
    const cx = enemigo.x * TAM_CASILLA;
    const cy = enemigo.y * TAM_CASILLA;
    const tam = TAM_CASILLA * 0.65;

    let angulo = 0;
    if(enemigo.dx === 1) angulo = 0;
    else if(enemigo.dy === 1) angulo = Math.PI/2;
    else if(enemigo.dx === -1) angulo = Math.PI;
    else if(enemigo.dy === -1) angulo = -Math.PI/2;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angulo);

    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.roundRect(-tam/2, -tam/4, tam, tam/2, 4);
    ctx.fill();
    ctx.strokeStyle = '#c0392b';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#2c3e50';
    ctx.beginPath();
    ctx.arc(-tam/3, -tam/3, 5, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-tam/3, tam/3, 5, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(tam/3, -tam/3, 5, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(tam/3, tam/3, 5, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = '#922b21';
    ctx.fillRect(-tam/6, -tam/6, tam/2, tam/3);

    ctx.restore();
}

// === DIBUJAR BALAS ===
function dibujarBalas() {
    balas.forEach(b => {
        ctx.save();
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.arc(b.x*TAM_CASILLA+TAM_CASILLA/2, b.y*TAM_CASILLA+TAM_CASILLA/2, 6, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
    });
}

// === DIBUJAR EXPLOSIONES ===
function dibujarExplosiones() {
    explosiones.forEach(exp => {
        ctx.save();
        ctx.globalAlpha = exp.vida / exp.maxVida;
        const tam = (1 - exp.vida/exp.maxVida) * TAM_CASILLA * 2;

        ctx.fillStyle = '#ff6600';
        ctx.beginPath();
        ctx.arc(exp.x*TAM_CASILLA+TAM_CASILLA/2, exp.y*TAM_CASILLA+TAM_CASILLA/2, tam, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = '#ffff00';
        ctx.beginPath();
        ctx.arc(exp.x*TAM_CASILLA+TAM_CASILLA/2, exp.y*TAM_CASILLA+TAM_CASILLA/2, tam*0.5, 0, Math.PI*2);
        ctx.fill();

        ctx.restore();
    });
}

// === LÓGICA DE COLISIONES ===
function puedeMover(x, y) {
    const casX = Math.floor(x);
    const casY = Math.floor(y);
    if(casX < 0 || casY < 0 || casX >= ANCHO || casY >= ALTO) return false;
    return mapa[casY][casX] === VACIO;
}

function puedeMoverEnemigo(x, y) {
    const casX = Math.floor(x + 0.5);
    const casY = Math.floor(y + 0.5);
    if(casX < 0 || casY < 0 || casX >= ANCHO || casY >= ALTO) return false;
    return mapa[casY][casX] === VACIO;
}

// === MOVIMIENTO DEL JUGADOR ===
function moverJugador(dx, dy) {
    if(JUGADOR_MUERTO) return;
    iniciarAudio();

    if(dx !== 0) { jugador.dirX = dx; jugador.dirY = 0; }
    if(dy !== 0) { jugador.dirY = dy; jugador.dirX = 0; }

    const nx = jugador.x + dx * 0.15;
    const ny = jugador.y + dy * 0.15;

    if(puedeMover(nx, ny) && puedeMover(nx+0.4, ny) && puedeMover(nx, ny+0.4) && puedeMover(nx+0.4, ny+0.4)) {
        jugador.x = nx;
        jugador.y = ny;
    }
    comprobarChoqueEnemigos();
}

// === DISPARAR ===
function disparar() {
    if(JUGADOR_MUERTO) return;
    iniciarAudio();
    const ahora = Date.now();
    if(ahora - jugador.ultimoDisparo < 400) return;
    jugador.ultimoDisparo = ahora;

    reproducirSonido('disparo');

    balas.push({
        x: jugador.x + jugador.dirX * 0.6,
        y: jugador.y + jugador.dirY * 0.6,
        dx: jugador.dirX,
        dy: jugador.dirY
    });
}

// === ACTUALIZAR BALAS ===
function actualizarBalas() {
    for(let i = balas.length-1; i >= 0; i--) {
        let b = balas[i];
        let nx = b.x + b.dx * 0.25;
        let ny = b.y + b.dy * 0.25;
        let casX = Math.floor(nx + 0.5);
        let casY = Math.floor(ny + 0.5);

        if(mapa[casY]?.[casX] === PARED) {
            balas.splice(i, 1);
            continue;
        }

        if(mapa[casY]?.[casX] === BLOQUE) {
            mapa[casY][casX] = VACIO;
            reproducirSonido('destruirBloque');
            balas.splice(i, 1);
            continue;
        }

        let indiceE = enemigos.findIndex(e => 
            Math.abs(e.x - nx - 0.5) < 0.6 && Math.abs(e.y - ny - 0.5) < 0.6
        );
        if(indiceE !== -1) {
            enemigos.splice(indiceE, 1);
            reproducirSonido('derrotarEnemigo');
            explosiones.push({x: nx, y: ny, vida: 25, maxVida: 25});
            balas.splice(i, 1);
            actualizarUI();
            comprobarFinNivel();
            continue;
        }

        b.x = nx;
        b.y = ny;
    }
}

// === ACTUALIZAR ENEMIGOS ===
function actualizarEnemigos() {
    const ahora = Date.now();
    enemigos.forEach(e => {
        if(ahora - e.ultimoMov < VELOCIDAD_ENEMIGOS) return;
        e.ultimoMov = ahora;

        let nx = e.x + e.dx;
        let ny = e.y + e.dy;

        if(!puedeMoverEnemigo(e.x, e.y)) {
            e.x = Math.floor(e.x) + 0.5;
            e.y = Math.floor(e.y) + 0.5;
        }

        if(!puedeMoverEnemigo(nx, ny)) {
            const dirs = [
                [jugador.x - e.x > 0 ? 1 : -1, 0],
                [0, jugador.y - e.y > 0 ? 1 : -1],
                [1, 0], [-1, 0], [0, 1], [0, -1]
            ];
            let encontrado = false;
            for(let [dx, dy] of dirs) {
                if(puedeMoverEnemigo(e.x + dx, e.y + dy)) {
                    e.dx = dx;
                    e.dy = dy;
                    encontrado = true;
                    break;
                }
            }
            if(!encontrado) { e.dx = 0; e.dy = 0; }
        }

        if(puedeMoverEnemigo(e.x + e.dx, e.y + e.dy)) {
            e.x += e.dx;
            e.y += e.dy;
        }

        comprobarChoqueEnemigos();
    });
}

// === COMPROBAR CHOQUE JUGADOR-ENEMIGO ===
function comprobarChoqueEnemigos() {
    if(JUGADOR_MUERTO) return;

    let tocado = enemigos.some(e => 
        Math.abs(e.x - jugador.x - 0.5) < 0.6 && 
        Math.abs(e.y - jugador.y - 0.5) < 0.6
    );

    if(tocado) {
        iniciarAudio();
        JUGADOR_MUERTO = true;
        reproducirSonido('explosion');
        reproducirSonido('perderVida');

        explosiones.push({
            x: jugador.x, 
            y: jugador.y, 
            vida: 40, 
            maxVida: 40
        });

        vidas--;
        actualizarUI();

        setTimeout(() => {
            if(vidas <= 0) {
                alert(`💀 ¡Perdiste! Llegaste al nivel ${nivel}\n¡Inténtalo de nuevo!`);
                nivel = 1; vidas = 3;
                reiniciarNivel();
            } else {
                jugador.x = 1.5;
                jugador.y = 1.5;
                JUGADOR_MUERTO = false;
            }
        }, 1000);
    }
}

// === ACTUALIZAR EXPLOSIONES ===
function actualizarExplosiones() {
    for(let i = explosiones.length-1; i >= 0; i--) {
        explosiones[i].vida--;
        if(explosiones[i].vida <= 0) {
            explosiones.splice(i, 1);
        }
    }
}

// === COMPROBAR FIN DE NIVEL ===
function comprobarFinNivel() {
    if(enemigos.length === 0) {
        reproducirSonido('nivelSuperado');
        nivel++;
        alert(`🎉 ¡Nivel ${nivel-1} COMPLETADO!\nPreparándose para el nivel ${nivel}...\n⚠️ ¡Los enemigos serán más rápidos y numerosos!`);
        reiniciarNivel();
    }
}

// === ACTUALIZAR INTERFAZ ===
function actualizarUI() {
    document.getElementById('nivel').textContent = nivel;
    document.getElementById('vidas').textContent = vidas;
    document.getElementById('enemigos').textContent = enemigos.length;
}

// === CONTROLES ===
document.addEventListener('keydown', e => {
    if(JUGADOR_MUERTO) return;
    if(e.key === 'ArrowUp') moverJugador(0, -1);
    if(e.key === 'ArrowDown') moverJugador(0, 1);
    if(e.key === 'ArrowLeft') moverJugador(-1, 0);
    if(e.key === 'ArrowRight') moverJugador(1, 0);
    if(e.key === ' ') { e.preventDefault(); disparar(); }
});

document.getElementById('btnArriba').addEventListener('touchstart', e => { e.preventDefault(); moverJugador(0, -1); });
document.getElementById('btnAbajo').addEventListener('touchstart', e => { e.preventDefault(); moverJugador(0, 1); });
document.getElementById('btnIzquierda').addEventListener('touchstart', e => { e.preventDefault(); moverJugador(-1, 0); });
document.getElementById('btnDerecha').addEventListener('touchstart', e => { e.preventDefault(); moverJugador(1, 0); });
document.getElementById('btnDisparar').addEventListener('touchstart', e => { e.preventDefault(); disparar(); });

document.getElementById('btnArriba').onmousedown = () => moverJugador(0, -1);
document.getElementById('btnAbajo').onmousedown = () => moverJugador(0, 1);
document.getElementById('btnIzquierda').onmousedown = () => moverJugador(-1, 0);
document.getElementById('btnDerecha').onmousedown = () => moverJugador(1, 0);
document.getElementById('btnDisparar').onmousedown = () => disparar();

// === BUCLE PRINCIPAL DEL JUEGO ===
reiniciarNivel();
function bucle() {
    actualizarBalas();
    actualizarEnemigos();
    actualizarExplosiones();

    dibujarMapa();
    enemigos.forEach(e => dibujarMoto(e));
    if(!JUGADOR_MUERTO) dibujarCarro();
    dibujarBalas();
    dibujarExplosiones();

    requestAnimationFrame(bucle);
}
bucle();

</script>
